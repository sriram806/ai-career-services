# ============================================
# AI Career OS — Auth-Only Docker Compose Stack
# Includes infrastructure + gateway + auth-service + client
# ============================================

services:
  # ─── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: acos-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ai_career_os
      POSTGRES_PASSWORD: changeme_postgres
      POSTGRES_DB: ai_career_os
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_career_os"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acos-network

  # ─── MongoDB ────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: acos-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ai_career_os
      MONGO_INITDB_ROOT_PASSWORD: changeme_mongo
      MONGO_INITDB_DATABASE: ai_career_os
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acos-network

  # ─── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: acos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass changeme_redis --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "changeme_redis", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - acos-network

  # ─── Node Microservices ─────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE_NAME: gateway
    container_name: acos-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      MONGO_URI: mongodb://ai_career_os:changeme_mongo@mongodb:27017/ai_career_os?authSource=admin
      AUTH_SERVICE_URL: http://auth-service:3001
      CORS_ORIGIN: http://localhost:3100
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - acos-network

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        SERVICE_NAME: auth-service
    container_name: acos-auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      POSTGRES_HOST: postgres
      MONGO_HOST: mongodb
      REDIS_HOST: redis
      MONGO_URI: mongodb://ai_career_os:changeme_mongo@mongodb:27017/ai_career_os?authSource=admin
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - acos-network

  # ─── Frontend (Next.js Client) ─────────────────────
  client:
    build:
      context: ../
      dockerfile: services/Dockerfile.client
    container_name: acos-client
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    ports:
      - "3100:3000"
    depends_on:
      gateway:
        condition: service_started
    networks:
      - acos-network

  # ─── Developer Tools ────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: acos-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@aicareer.os
      PGADMIN_DEFAULT_PASSWORD: changeme_pgadmin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - acos-network

  mongo-express:
    image: mongo-express:latest
    container_name: acos-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ai_career_os
      ME_CONFIG_MONGODB_ADMINPASSWORD: changeme_mongo
      ME_CONFIG_MONGODB_URL: mongodb://ai_career_os:changeme_mongo@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - acos-network

# ─── Volumes ─────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  mongo_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# ─── Networks ────────────────────────────────────────
networks:
  acos-network:
    driver: bridge
    name: acos-network
